name: Publish to npm

# Uses npm trusted publishing (OIDC) - no NPM_TOKEN secret needed. The trusted
# publisher must be registered on the npmjs.com package settings, pointing at this
# exact repo + workflow file before this can succeed.
on:
  push:
    tags:
      - "v*"
  # Manual runs publish whatever version the selected ref has in package.json;
  # npm rejects a version that is already published, so a stale ref fails loudly.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Pinned rather than @latest so an
      # untested npm release cannot silently change publish behaviour.
      - run: npm install -g npm@12.0.2

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # prepack runs the build.
      - run: npm publish
